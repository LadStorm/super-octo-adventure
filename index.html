<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GroceryCompare">
  <meta name="theme-color" content="#16a34a">
  <link rel="manifest" href="manifest.json">
  <title>GroceryCompare AU</title>
  <style>
    :root {
      --bg: #f0f4f0;
      --card: #ffffff;
      --border: #e2e8e2;
      --text: #1a2e1a;
      --muted: #64786a;
      --radius: 12px;
      --ww-dark: #1b5e20;
      --ww-mid: #2e7d32;
      --ww-light: #e8f5e9;
      --coles-dark: #b71c1c;
      --coles-mid: #c62828;
      --coles-light: #ffebee;
      --aldi-dark: #0d47a1;
      --aldi-mid: #1565c0;
      --aldi-light: #e3f2fd;
      --best-bg: #dcfce7;
      --best-text: #14532d;
      --best-border: #86efac;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
    }

    /* ── Header ── */
    header {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 14px 16px 10px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    h1 span { color: #16a34a; }

    .postcode-row {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .postcode-label {
      font-size: 0.8rem;
      color: var(--muted);
    }

    #postcodeInput {
      width: 76px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      background: var(--bg);
      outline: none;
      color: var(--text);
      -webkit-appearance: none;
    }

    #postcodeInput:focus { border-color: #16a34a; }

    .btn-refresh {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 13px;
      background: #16a34a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-refresh:hover { background: #15803d; }
    .btn-refresh:active { background: #166534; }
    .btn-refresh:disabled { opacity: 0.5; cursor: default; }

    #lastUpdated {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .staleness-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    /* ── Main ── */
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px;
    }

    /* ── Savings Banner ── */
    .savings-banner {
      background: linear-gradient(135deg, #166534 0%, #15803d 100%);
      color: #fff;
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 14px;
    }

    .savings-headline {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .savings-sub {
      font-size: 0.82rem;
      opacity: 0.85;
      margin-top: 3px;
    }

    .store-compare-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .store-pill {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(255,255,255,0.18);
      color: #fff;
      white-space: nowrap;
    }

    /* ── Store Cards ── */
    .store-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    @media (max-width: 580px) {
      .store-cards { grid-template-columns: 1fr; }
    }

    .store-card {
      border-radius: var(--radius);
      border: 2px solid transparent;
      overflow: hidden;
      background: var(--card);
    }

    .store-card.ww  { border-color: var(--ww-mid); }
    .store-card.coles { border-color: var(--coles-mid); }
    .store-card.aldi  { border-color: var(--aldi-mid); }

    .store-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 13px;
      color: #fff;
      font-weight: 700;
    }

    .store-card.ww   .store-card-head { background: var(--ww-mid); }
    .store-card.coles .store-card-head { background: var(--coles-mid); }
    .store-card.aldi  .store-card-head { background: var(--aldi-mid); }

    .sc-name  { font-size: 0.9rem; }
    .sc-count { font-size: 0.72rem; opacity: 0.88; background: rgba(0,0,0,0.18); border-radius: 10px; padding: 2px 7px; }

    .store-card-body { padding: 11px 13px; }

    .sc-total { font-size: 1.25rem; font-weight: 800; }
    .sc-note  { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

    .sc-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: none;
      border: none;
      border-top: 1px solid var(--border);
      padding: 8px 0 0;
      margin-top: 9px;
      cursor: pointer;
      font-size: 0.75rem;
      color: var(--muted);
      -webkit-tap-highlight-color: transparent;
    }

    .sc-toggle:hover { color: var(--text); }

    .sc-list {
      display: none;
      padding-top: 8px;
      margin-top: 8px;
      border-top: 1px solid var(--border);
    }

    .sc-list.open { display: block; }

    .sc-list-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 0;
      font-size: 0.78rem;
      gap: 8px;
    }

    .sc-list-row .scl-name { color: var(--text); flex: 1; }
    .sc-list-row .scl-price { color: var(--muted); font-weight: 600; white-space: nowrap; }

    /* ── Category Tabs ── */
    .cat-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }

    .cat-tabs::-webkit-scrollbar { display: none; }

    .cat-tab {
      padding: 6px 13px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.12s;
      -webkit-tap-highlight-color: transparent;
    }

    .cat-tab.active { background: #16a34a; color: #fff; border-color: #16a34a; }
    .cat-tab:hover:not(.active) { border-color: #16a34a; color: #16a34a; }

    /* ── Price Table ── */
    .table-card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .table-scroll { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 480px;
    }

    thead th {
      padding: 11px 13px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      text-align: center;
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
    }

    thead th:first-child { text-align: left; min-width: 170px; }
    thead .th-ww    { background: var(--ww-light);   color: var(--ww-dark); }
    thead .th-coles { background: var(--coles-light); color: var(--coles-dark); }
    thead .th-aldi  { background: var(--aldi-light);  color: var(--aldi-dark); }

    tr.cat-row td {
      background: var(--bg);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--muted);
      padding: 7px 13px;
      border-top: 1px solid var(--border);
    }

    tr.item-row td {
      padding: 9px 13px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr.item-row:last-child td { border-bottom: none; }
    tr.item-row:hover { background: #f7faf7; }

    .item-name { font-size: 0.88rem; font-weight: 600; }
    .item-unit { font-size: 0.7rem; color: var(--muted); margin-top: 1px; }

    .price-cell { text-align: center; min-width: 95px; }

    .price-val { font-size: 0.92rem; font-weight: 600; }

    .price-cell.best { background: var(--best-bg); }
    .price-cell.best .price-val { color: var(--best-text); }

    .best-tag {
      display: block;
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--best-text);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-top: 1px;
    }

    .price-na { color: #ccc; font-size: 0.85rem; }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 24px 16px 32px;
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.7;
    }

    footer a { color: var(--muted); }

    /* ── Loading / Error ── */
    .state-msg {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .spinner {
      display: inline-block;
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: #16a34a;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes spin-btn { to { transform: rotate(360deg); } }
    .btn-refresh.loading svg { animation: spin-btn 0.65s linear infinite; }
  </style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="logo">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
        <rect width="30" height="30" rx="8" fill="#16a34a"/>
        <path d="M5 8h2.5L11 20h11l2.5-8.5H9" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="12.5" cy="23" r="1.5" fill="white"/>
        <circle cx="19.5" cy="23" r="1.5" fill="white"/>
      </svg>
      <h1>Grocery<span>Compare</span></h1>
    </div>
    <div class="postcode-row">
      <span class="postcode-label">Postcode</span>
      <input id="postcodeInput" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="e.g. 3000">
      <button class="btn-refresh" id="refreshBtn" onclick="refresh()">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <path d="M11.5 6.5A5 5 0 1 1 6.5 1.5v2M6.5 1.5l1.8-1.8M6.5 1.5l1.8 1.8" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Refresh
      </button>
    </div>
  </div>
  <div id="lastUpdated"></div>
</header>

<main id="main">
  <div class="state-msg"><span class="spinner"></span>Loading prices…</div>
</main>

<footer>
  Prices are approximate national averages · Always verify at the store · Prices vary by location &amp; specials<br>
  Data sourced manually · <span id="footerUpdated"></span>
</footer>

<script>
const STORES = ['woolworths', 'coles', 'aldi'];
const STORE_LABELS = { woolworths: 'Woolworths', coles: 'Coles', aldi: 'ALDI' };
const STORE_CLASS  = { woolworths: 'ww', coles: 'coles', aldi: 'aldi' };

let priceData   = null;
let activeCategory = 'all';

// ── Init ────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('postcode');
  if (saved) document.getElementById('postcodeInput').value = saved;

  document.getElementById('postcodeInput').addEventListener('change', e => {
    localStorage.setItem('postcode', e.target.value.trim());
  });

  loadPrices();
});

// ── Data loading ────────────────────────────────
async function loadPrices() {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  btn.classList.add('loading');

  try {
    const res = await fetch(`prices.json?t=${Date.now()}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    priceData = await res.json();
    render();
  } catch (err) {
    document.getElementById('main').innerHTML =
      `<div class="state-msg" style="color:#c62828">
         Failed to load prices: ${escHtml(err.message)}<br>
         <button class="btn-refresh" style="margin-top:12px" onclick="refresh()">Try again</button>
       </div>`;
  } finally {
    btn.disabled = false;
    btn.classList.remove('loading');
  }
}

function refresh() { loadPrices(); }

// ── Main render ─────────────────────────────────
function render() {
  if (!priceData) return;

  updateTimestamp();

  const categories = ['all', ...getCategories(priceData.items)];
  const gameplan   = calcGameplan(priceData.items);

  document.getElementById('main').innerHTML =
    renderBanner(gameplan) +
    renderStoreCards(gameplan) +
    renderCatTabs(categories) +
    `<div class="table-card"><div class="table-scroll"><table>` +
      renderTableHead() +
      `<tbody id="tbody">` + renderRows(priceData.items, activeCategory) + `</tbody>` +
    `</table></div></div>`;

  // Category tab events
  document.querySelectorAll('.cat-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      activeCategory = tab.dataset.cat;
      document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('tbody').innerHTML =
        renderRows(priceData.items, activeCategory);
    });
  });

  // Store card toggle events
  document.querySelectorAll('.sc-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const store = btn.dataset.store;
      const list  = document.getElementById(`sc-list-${store}`);
      const open  = list.classList.toggle('open');
      btn.querySelector('.sc-chevron').textContent = open ? '▲ Hide' : '▼ Show';
    });
  });
}

// ── Timestamp ───────────────────────────────────
function updateTimestamp() {
  const updated = new Date(priceData.lastUpdated);
  const now     = new Date();
  const ageH    = (now - updated) / 36e5;
  const fresh   = ageH < 24;
  const stale   = ageH > 168; // >7 days

  const dot   = fresh ? '#22c55e' : stale ? '#ef4444' : '#f59e0b';
  const label = fresh ? 'fresh' : stale ? 'outdated' : 'recent';
  const str   = updated.toLocaleString('en-AU', {
    day: 'numeric', month: 'short', year: 'numeric',
    hour: '2-digit', minute: '2-digit', timeZoneName: 'short'
  });

  document.getElementById('lastUpdated').innerHTML =
    `<span class="staleness-dot" style="background:${dot}" title="${label}"></span>
     Prices last updated: ${str}`;
  document.getElementById('footerUpdated').textContent = `Last updated ${str}`;
}

// ── Gameplan calculation ─────────────────────────
function calcGameplan(items) {
  const plans  = { woolworths: [], coles: [], aldi: [] };
  let totals   = { woolworths: 0, coles: 0, aldi: 0 };
  let optimal  = 0;
  let wwAllIn  = 0;

  items.forEach(item => {
    const avail = STORES.filter(s => item[s]?.price != null);
    if (!avail.length) return;

    const minPrice = Math.min(...avail.map(s => item[s].price));

    // Pick cheapest store (prefer ALDI on tie)
    const cheapest = ['aldi','coles','woolworths'].find(s => item[s]?.price === minPrice);
    plans[cheapest].push({ name: item.name, price: minPrice, unit: item.unit });
    optimal += minPrice;

    STORES.forEach(s => {
      if (item[s]?.price) totals[s] += item[s].price;
    });

    if (item.woolworths?.price) wwAllIn += item.woolworths.price;
  });

  const savings    = wwAllIn - optimal;
  const savingsPct = wwAllIn > 0 ? ((savings / wwAllIn) * 100).toFixed(0) : 0;
  const vsColes    = totals.coles - optimal;

  return { plans, totals, optimal, wwAllIn, savings, savingsPct, vsColes };
}

// ── Render helpers ───────────────────────────────
function getCategories(items) {
  return [...new Set(items.map(i => i.category))];
}

function fmt(price) {
  return price != null ? `$${price.toFixed(2)}` : null;
}

function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Banner HTML ─────────────────────────────────
function renderBanner(gp) {
  return `
  <div class="savings-banner">
    <div class="savings-headline">Save ${fmt(gp.savings)} (${gp.savingsPct}%) on your basket</div>
    <div class="savings-sub">Optimal split-shop vs buying everything at Woolworths · ${priceData.items.length} items tracked</div>
    <div class="store-compare-row">
      <span class="store-pill">Woolworths ${fmt(gp.totals.woolworths)}</span>
      <span class="store-pill">Coles ${fmt(gp.totals.coles)}</span>
      <span class="store-pill">ALDI ${fmt(gp.totals.aldi)}</span>
      <span class="store-pill" style="background:rgba(255,255,255,0.32);font-weight:800">Optimal ${fmt(gp.optimal)}</span>
    </div>
  </div>`;
}

// ── Store Cards HTML ─────────────────────────────
function renderStoreCards(gp) {
  const postcode = document.getElementById('postcodeInput').value.trim();
  const pcNote   = postcode ? `near ${postcode}` : 'national avg.';

  return `<div class="store-cards">` +
    STORES.map(store => {
      const items = gp.plans[store];
      const cls   = STORE_CLASS[store];
      const total = items.reduce((s, i) => s + i.price, 0);
      return `
      <div class="store-card ${cls}">
        <div class="store-card-head">
          <span class="sc-name">${STORE_LABELS[store]}</span>
          <span class="sc-count">${items.length} item${items.length !== 1 ? 's' : ''}</span>
        </div>
        <div class="store-card-body">
          <div class="sc-total">${fmt(total)}</div>
          <div class="sc-note">Best price on ${items.length} items · ${pcNote}</div>
          <button class="sc-toggle" data-store="${store}">
            <span>What to buy here</span>
            <span class="sc-chevron">▼ Show</span>
          </button>
          <div class="sc-list" id="sc-list-${store}">
            ${items.map(i => `
              <div class="sc-list-row">
                <span class="scl-name">${escHtml(i.name)}</span>
                <span class="scl-price">${fmt(i.price)}</span>
              </div>`).join('')}
          </div>
        </div>
      </div>`;
    }).join('') +
  `</div>`;
}

// ── Category Tabs HTML ───────────────────────────
function renderCatTabs(categories) {
  return `<div class="cat-tabs">` +
    categories.map(cat => {
      const label  = cat === 'all' ? 'All items' : cat;
      const active = cat === activeCategory ? ' active' : '';
      return `<button class="cat-tab${active}" data-cat="${escHtml(cat)}">${escHtml(label)}</button>`;
    }).join('') +
  `</div>`;
}

// ── Table Head HTML ──────────────────────────────
function renderTableHead() {
  return `<thead><tr>
    <th>Item</th>
    <th class="th-ww">Woolworths</th>
    <th class="th-coles">Coles</th>
    <th class="th-aldi">ALDI</th>
  </tr></thead>`;
}

// ── Table Rows HTML ──────────────────────────────
function renderRows(items, category) {
  const filtered = category === 'all'
    ? items
    : items.filter(i => i.category === category);

  // Group by category
  const grouped = {};
  filtered.forEach(item => {
    if (!grouped[item.category]) grouped[item.category] = [];
    grouped[item.category].push(item);
  });

  let html = '';
  Object.entries(grouped).forEach(([cat, catItems]) => {
    if (category === 'all') {
      html += `<tr class="cat-row"><td colspan="4">${escHtml(cat)}</td></tr>`;
    }
    catItems.forEach(item => {
      const prices = STORES.map(s => item[s]?.price ?? null);
      const validPrices = prices.filter(p => p != null);
      const minPrice = validPrices.length ? Math.min(...validPrices) : null;

      html += `<tr class="item-row"><td>
        <div class="item-name">${escHtml(item.name)}</div>
        <div class="item-unit">${escHtml(item.unit)}</div>
      </td>`;

      STORES.forEach((store, i) => {
        const p = prices[i];
        if (p == null) {
          html += `<td class="price-cell"><span class="price-na">N/A</span></td>`;
        } else {
          const isBest = p === minPrice;
          html += `<td class="price-cell${isBest ? ' best' : ''}">
            <span class="price-val">${fmt(p)}</span>
            ${isBest ? `<span class="best-tag">★ Best</span>` : ''}
          </td>`;
        }
      });

      html += `</tr>`;
    });
  });

  return html || `<tr><td colspan="4" style="padding:20px;text-align:center;color:var(--muted)">No items in this category.</td></tr>`;
}
</script>

</body>
</html>
